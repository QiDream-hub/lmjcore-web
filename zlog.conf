# ===========================================
# zlog 配置文件
# ===========================================
# 注意：日志级别由 lmjcore.conf 中的 log_level 参数控制
# 0 = DEBUG, 1 = INFO, 2 = WARN, 3 = ERROR
# ===========================================

[global]
strict = 0
default = main

[main]
level = DEBUG
format = "%d %V %-6c [%F:%L] %m%n"
file = /dev/stdout
